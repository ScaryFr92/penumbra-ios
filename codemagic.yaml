# Codemagic builds for Penumbra (iOS).
#
# Before the first build, in Codemagic:
#   1. Settings > Integrations > Developer Portal: an App Store Connect API key
#      and name it "Penumbra" (or change "app_store_connect: Trotti" below).
#   2. In App Store Connect, create the app with bundle ID com.scaryfr92.penumbra
#      (only needed for the TestFlight workflow).
#
# ios-testflight: uploads to TestFlight, install it with the TestFlight app.
# ios-adhoc: builds an .ipa for the devices registered on your Apple account.

definitions:
  build_scripts: &build_scripts
    - name: Fetch submodules
      script: git submodule update --init --recursive
    - name: Use signing profiles
      script: xcode-project use-profiles
    - name: Build ipa
      script: |
        xcode-project build-ipa \
          --project Moonlight.xcodeproj \
          --scheme Moonlight \
          --archive-xcargs "CURRENT_PROJECT_VERSION=$BUILD_NUMBER"
  artifacts: &artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

workflows:
  ios-testflight:
    name: Penumbra iOS (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Trotti
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.scaryfr92.penumbra
    scripts: *build_scripts
    artifacts: *artifacts
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers get the build without Apple's beta review
        submit_to_testflight: false

  ios-adhoc:
    name: Penumbra iOS (Ad Hoc)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Trotti
    environment:
      xcode: latest
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.scaryfr92.penumbra
    scripts: *build_scripts
    artifacts: *artifacts
